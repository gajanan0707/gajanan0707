<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Gajanan Patil technology stack</title>
<desc id="desc">An animated Naruto-inspired technology orbit with Python, Django, FastAPI, React, Next.js, PostgreSQL, Redis, AWS, Docker and AI tools.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2e"/><stop offset=".6" stop-color="#17233b"/><stop offset="1" stop-color="#302033"/></linearGradient>
 <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9b35"/><stop offset=".52" stop-color="#ffc247"/><stop offset="1" stop-color="#e85b43"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".18" stop-color="#ffc247" stop-opacity=".85"/><stop offset=".55" stop-color="#7c3aed" stop-opacity=".28"/><stop offset="1" stop-color="#ff9b35" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffe0a0" opacity=".13"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="760" rx="28" fill="#0a1020"/>
<rect x="14" y="14" width="1172" height="732" rx="26" fill="url(#bg)" stroke="url(#aurora)" stroke-opacity=".6"/>
<rect x="14" y="14" width="1172" height="732" rx="26" fill="url(#dots)"/>
<text x="54" y="67" fill="#f8fafc" font-size="31" font-weight="800" font-family="Arial,sans-serif">THE SHINOBI TECH ORBIT</text>
<text x="55" y="94" fill="#9ca3af" font-size="14" letter-spacing="2" font-family="Arial,sans-serif">TOOLS OF THE TRADE • BUILT TO SHIP</text>

<!-- orbital rings -->
<g transform="translate(600 350)">
 <ellipse rx="410" ry="145" transform="rotate(-24)" fill="none" stroke="#ff9b35" stroke-opacity=".34" stroke-width="1.6" stroke-dasharray="5 10"/>
 <ellipse rx="340" ry="120" transform="rotate(34)" fill="none" stroke="#ffc247" stroke-opacity=".38" stroke-width="1.6" stroke-dasharray="4 9"/>
 <ellipse rx="265" ry="95" transform="rotate(-58)" fill="none" stroke="#e85b43" stroke-opacity=".32" stroke-width="1.6" stroke-dasharray="3 8"/>
 <circle r="185" fill="url(#core)" opacity=".65"><animate attributeName="r" values="160;195;160" dur="4s" repeatCount="indefinite"/></circle>
 <circle r="102" fill="#111222" stroke="url(#aurora)" stroke-width="2" filter="url(#glow)"/>
 <circle r="88" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="2 8"/>
 <text x="0" y="-14" fill="#f8fafc" font-size="22" font-weight="800" text-anchor="middle" font-family="Arial,sans-serif">BUILD</text>
 <text x="0" y="17" fill="#ffe0a0" font-size="15" text-anchor="middle" font-family="Arial,sans-serif"> • CREATE • </text>
 <text x="0" y="43" fill="#ffd08a" font-size="11" letter-spacing="2" text-anchor="middle" font-family="Arial,sans-serif">GAJANAN0707</text>

 <!-- orbital nodes: positioned around rings; CSS/SMIL-safe static labels -->
 <g font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
  <g transform="translate(-355 -65)"><circle r="36" fill="#3d3036" stroke="#ff9b35"/><text y="5" fill="#fff0d6">Py</text><text y="53" fill="#9ca3af" font-size="11">Python</text></g>
  <g transform="translate(350 -110)"><circle r="36" fill="#283047" stroke="#ffc247"/><text y="5" fill="#fff0d6">Dj</text><text y="53" fill="#9ca3af" font-size="11">Django</text></g>
  <g transform="translate(420 85)"><circle r="36" fill="#392536" stroke="#e85b43"/><text y="5" fill="#ffd2bd">Fa</text><text y="53" fill="#9ca3af" font-size="11">FastAPI</text></g>
  <g transform="translate(-265 115)"><circle r="36" fill="#3d3036" stroke="#ff9b35"/><text y="5" fill="#fff0d6">Re</text><text y="53" fill="#9ca3af" font-size="11">React</text></g>
  <g transform="translate(60 -255)"><circle r="36" fill="#283047" stroke="#ffc247"/><text y="5" fill="#fff0d6">N</text><text y="53" fill="#9ca3af" font-size="11">Next.js</text></g>
  <g transform="translate(-85 255)"><circle r="36" fill="#392536" stroke="#e85b43"/><text y="5" fill="#ffd2bd">Pg</text><text y="53" fill="#9ca3af" font-size="11">PostgreSQL</text></g>
  <g transform="translate(265 220)"><circle r="36" fill="#3d3036" stroke="#ff9b35"/><text y="5" fill="#fff0d6">Rd</text><text y="53" fill="#9ca3af" font-size="11">Redis</text></g>
  <g transform="translate(-435 15)"><circle r="36" fill="#283047" stroke="#ffc247"/><text y="5" fill="#fff0d6">AWS</text><text y="53" fill="#9ca3af" font-size="11">Cloud</text></g>
  <g transform="translate(180 -165)"><circle r="30" fill="#392536" stroke="#e85b43"/><text y="5" fill="#ffd2bd">AI</text></g>
 </g>

 <!-- small orbiting moons around React node -->
 <g>
  <circle cx="-265" cy="115" r="49" fill="none" stroke="#ffd08a" stroke-opacity=".45" stroke-dasharray="2 5"/>
  <g>
   <circle cx="-314" cy="115" r="8" fill="#ffc247" stroke="#fff" stroke-opacity=".8"/>
   <animateTransform attributeName="transform" type="rotate" from="0 -265 115" to="360 -265 115" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
   <circle cx="-265" cy="66" r="6" fill="#e85b43" stroke="#fff" stroke-opacity=".8"/>
   <animateTransform attributeName="transform" type="rotate" from="0 -265 115" to="-360 -265 115" dur="7s" repeatCount="indefinite"/>
  </g>
 </g>
 <g fill="#fff" opacity=".7"><circle cx="-150" cy="-130" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="170" cy="105" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="20" cy="-180" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle></g>
</g>

<!-- skill chips -->
<text x="55" y="600" fill="#f8fafc" font-size="19" font-weight="700" font-family="Arial,sans-serif">STACK SCROLL</text>
<g font-family="Arial,sans-serif" font-size="13">
 <g transform="translate(55 620)">
  <text x="0" y="0" fill="#ffd08a" font-size="12" letter-spacing="1.5">BACKEND</text>
  <g transform="translate(0 14)" fill="#dbeafe"><rect width="105" height="34" rx="17" fill="#3a2c32" stroke="#ff9b35"/><text x="52" y="22" text-anchor="middle">Python</text><rect x="115" width="105" height="34" rx="17" fill="#3a2c32" stroke="#ff9b35"/><text x="167" y="22" text-anchor="middle">Django</text><rect x="230" width="105" height="34" rx="17" fill="#3a2c32" stroke="#ff9b35"/><text x="282" y="22" text-anchor="middle">FastAPI</text><rect x="345" width="105" height="34" rx="17" fill="#3a2c32" stroke="#ff9b35"/><text x="397" y="22" text-anchor="middle">Flask</text></g>
 </g>
 <g transform="translate(535 620)">
  <text x="0" y="0" fill="#ffe0a0" font-size="12" letter-spacing="1.5">FRONTEND &amp; DEVOPS</text>
  <g transform="translate(0 14)" fill="#ede9fe"><rect width="94" height="34" rx="17" fill="#283047" stroke="#ffc247"/><text x="47" y="22" text-anchor="middle">React</text><rect x="104" width="105" height="34" rx="17" fill="#283047" stroke="#ffc247"/><text x="156" y="22" text-anchor="middle">Next.js</text><rect x="219" width="94" height="34" rx="17" fill="#283047" stroke="#ffc247"/><text x="266" y="22" text-anchor="middle">Docker</text><rect x="323" width="76" height="34" rx="17" fill="#283047" stroke="#ffc247"/><text x="361" y="22" text-anchor="middle">AWS</text></g>
 </g>
 <g transform="translate(55 704)">
  <text x="0" y="0" fill="#ffb18f" font-size="12" letter-spacing="1.5">DATA &amp; AI</text>
  <g transform="translate(95 -20)" fill="#fce7f3"><rect width="120" height="30" rx="15" fill="#392536" stroke="#e85b43"/><text x="60" y="20" text-anchor="middle">PostgreSQL</text><rect x="130" width="82" height="30" rx="15" fill="#392536" stroke="#e85b43"/><text x="171" y="20" text-anchor="middle">Redis</text><rect x="222" width="92" height="30" rx="15" fill="#392536" stroke="#e85b43"/><text x="268" y="20" text-anchor="middle">Firebase</text><rect x="324" width="82" height="30" rx="15" fill="#392536" stroke="#e85b43"/><text x="365" y="20" text-anchor="middle">GenAI</text><rect x="416" width="78" height="30" rx="15" fill="#392536" stroke="#e85b43"/><text x="455" y="20" text-anchor="middle">LLMs</text></g>
 </g>
</g>
<rect x="14.75" y="14.75" width="1170.5" height="730.5" rx="25.5" fill="none" stroke="url(#aurora)" stroke-opacity=".42"/>
</svg>